<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closed-Loop Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f5f9;font-family:'Raleway',sans-serif;padding:40px 16px;min-height:100vh}
html.capture body{padding:0;background:#fff}
.stage{container-type:inline-size;width:min(580px,100%);margin:0 auto}
html.capture .stage{width:580px;margin:0}
.card{--u:calc(100cqw / 580);--navy:#252c58;--ink:#3a4a6a;--dim:#6b7394;--line:rgba(37,44,88,.12);
  --pass:#4F8FD9;--fail:#D9534F;--teal:#0FAE8C;--site:#F26B2A;
  position:relative;width:100%;aspect-ratio:580/620;background:#fff;border-radius:calc(18*var(--u));overflow:hidden;color:var(--navy)}
html.capture .card{border-radius:0}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}

.top{position:absolute;left:calc(18*var(--u));right:calc(18*var(--u));top:calc(16*var(--u));display:flex;align-items:center;justify-content:space-between}
.steps{display:flex;gap:calc(6*var(--u))}
.step{font-size:calc(11.5*var(--u));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  padding:calc(6*var(--u)) calc(12*var(--u));border-radius:999px;border:1.5px solid rgba(37,44,88,.14);background:rgba(37,44,88,.03)}
.step.on{color:#fff;background:var(--navy);border-color:var(--navy)}
.site{display:flex;align-items:baseline;gap:calc(6*var(--u));font-weight:700}
.site .lbl{font-size:calc(12*var(--u));color:var(--dim);letter-spacing:.04em}
.site .num{font-size:calc(22*var(--u));color:var(--navy)}
.site small{font-size:calc(12*var(--u));color:var(--dim);margin-left:calc(2*var(--u))}

.scen{position:absolute;left:50%;top:calc(60*var(--u));transform:translateX(-50%);white-space:nowrap;
  font-size:calc(14.5*var(--u));font-weight:600;color:var(--navy);padding:calc(7*var(--u)) calc(16*var(--u));border-radius:999px;
  background:#f4f5fb;border:1px solid var(--line)}
.scen span{color:var(--dim);margin:0 calc(8*var(--u));font-weight:500}
.caption{position:absolute;left:0;right:0;top:calc(101*var(--u));text-align:center;font-size:calc(12.5*var(--u));font-weight:500;color:var(--dim)}

.panel{position:absolute;left:calc(16*var(--u));right:calc(16*var(--u));bottom:calc(16*var(--u));padding:calc(8*var(--u)) calc(16*var(--u)) calc(4*var(--u));
  border-radius:calc(12*var(--u));background:#fff;border:1px solid rgba(37,44,88,.1);box-shadow:0 calc(4*var(--u)) calc(18*var(--u)) rgba(37,44,88,.05)}
.panel .hd,.panel .row{display:grid;grid-template-columns:1fr repeat(3,calc(66*var(--u)));align-items:center}
.panel .hd{font-size:calc(10*var(--u));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding-bottom:calc(5*var(--u))}
.panel .hd span{text-align:center}
.panel .row{padding:calc(6*var(--u)) 0;border-top:1px solid rgba(37,44,88,.07);font-size:calc(13*var(--u));font-weight:600;color:var(--ink)}
.panel .name{display:flex;align-items:center;gap:calc(8*var(--u));white-space:nowrap;overflow:hidden}
.panel .name i{width:calc(8*var(--u));height:calc(8*var(--u));border-radius:50%;flex-shrink:0}
.panel .name em{font-style:normal;color:var(--dim);font-weight:500}
.pill{font-size:calc(9.5*var(--u));font-weight:700;letter-spacing:.06em;padding:calc(2*var(--u)) calc(8*var(--u));border-radius:999px;visibility:hidden}
.pill.hit{visibility:visible;color:#c4561d;background:#fde7da}
.pill.fail{visibility:visible;color:#b83a3a;background:#fbe3e3}
.st{justify-self:center;width:calc(19*var(--u));height:calc(19*var(--u));border-radius:50%;border:1.5px solid #c9cde0;position:relative}
.st.pass{background:var(--pass);border-color:var(--pass)}
.st.fail{background:var(--fail);border-color:var(--fail)}
.st.na{border-color:transparent}
.st.na::after{content:"";position:absolute;left:25%;right:25%;top:50%;height:1.5px;background:#aab0c6}
.st.pass::after,.st.fail::after{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(11*var(--u));font-weight:700;color:#fff}
.st.pass::after{content:"✓"} .st.fail::after{content:"✕"}

.tag{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.tag.big{display:flex;flex-direction:column;align-items:center;gap:calc(5*var(--u));font-size:calc(11*var(--u));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.slider{display:flex;align-items:center;gap:calc(7*var(--u));font-size:calc(9.5*var(--u));font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--dim)}
.track{position:relative;width:calc(104*var(--u));height:2px;border-radius:2px;background:#dfe2ee}
.track i{position:absolute;left:0;top:0;height:2px;background:var(--teal)}
.track b{position:absolute;top:calc(-4*var(--u));width:calc(10*var(--u));height:calc(10*var(--u));margin-left:calc(-5*var(--u));border-radius:50%;background:#fff;border:2px solid var(--navy)}
.chip{font-size:calc(11*var(--u));font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);padding:calc(3*var(--u)) calc(10*var(--u));
  border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(37,44,88,.06)}
.chip:empty{visibility:hidden}
.chip em{font-style:normal;font-weight:700;margin-right:calc(4*var(--u))}
.chip .ok{color:var(--teal)} .chip .no{color:var(--fail)}
.tag.sitetag{font-size:calc(10.5*var(--u));font-weight:600;color:var(--ink);padding:calc(3*var(--u)) calc(8*var(--u));border-radius:calc(6*var(--u));background:rgba(255,255,255,.9);border:1px solid var(--line)}
.tag.sitetag b{color:var(--site);margin-right:calc(5*var(--u))}

/* dark theme */
body{background:#03050b}
html.embed body{padding:0;background:#0d1538;min-height:0}
html.embed .stage{width:100%}
.card{--navy:#e3e9ff;--ink:#c9d3f5;--dim:#7d88b3;--line:rgba(160,180,255,.14);--pass:#59a8ff;--fail:#ff4d5e;--teal:#19d3a8;--site:#ff7a3a;background:#0d1538}
.step{color:var(--dim);border-color:rgba(160,180,255,.16);background:rgba(10,14,30,.4)}
.step.on{color:#0a0f22;background:#dfe8ff;border-color:#dfe8ff;box-shadow:0 0 18px rgba(160,190,255,.4)}
.scen{background:rgba(10,14,30,.55);border-color:var(--line)}
.panel{background:rgba(14,20,42,.55);border-color:var(--line);box-shadow:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel .row{border-top-color:rgba(160,180,255,.07)}
.st{border-color:rgba(160,180,255,.25)}
.st.pass{box-shadow:0 0 10px rgba(89,168,255,.6)} .st.fail{box-shadow:0 0 10px rgba(255,77,94,.6)}
.st.na::after{background:var(--dim)}
.pill.hit{color:#ffb38a;background:rgba(255,122,58,.16)} .pill.fail{color:#ff8d98;background:rgba(255,77,94,.14)}
.track{background:rgba(160,180,255,.2)} .track i{box-shadow:0 0 8px var(--teal)} .track b{background:#fff;border-color:#9fb8ff;box-shadow:0 0 10px #9fb8ff}
.chip{background:rgba(10,14,30,.65);border-color:var(--line);box-shadow:none}
.tag.sitetag{background:rgba(10,14,30,.6);color:var(--navy)}
</style>
</head>
<body>
<div class="stage">
<div class="card" id="card">
  <canvas id="gl" aria-label="Animation: on a dynamic target protein, AllotarX designs a different modality for each allosteric site, one at a time, tests binding, function and selectivity against an off-target protein, and redesigns candidates that fail until each site has a selective, functional hit."></canvas>
  <div class="hud" id="hud">
    <div class="top">
      <div class="steps"><div class="step" data-k="design">Design</div><div class="step" data-k="test">Test</div><div class="step" data-k="learn">Learn</div></div>
      <div class="site"><span class="lbl">Site</span><span class="num"><span id="cyc">—</span><small id="ver"></small></span></div>
    </div>
    <div class="scen" id="scen"></div>
    <div class="caption" id="cap"></div>
    <div class="panel" id="panel">
      <div class="hd"><span style="text-align:left">Candidate</span><span>Binding</span><span>Function</span><span>Selectivity</span></div>
    </div>
    <div class="tag big" id="tagT"><div>Target</div><div class="slider"><span>Open</span><div class="track"><i id="fill"></i><b id="knob"></b></div><span>Closed</span></div><div class="chip" id="chipT"></div></div>
    <div class="tag big" id="tagO"><div>Off-target</div><div class="chip" id="chipO"></div></div>
  </div>
</div>
</div>

    for (let i = 0; i < text.length; i++){ const r = i / text.length * .7; s += (k > r + .3 || text[i] === ' ') ? text[i] : k > r ? GLYPHS[Math.random()*GLYPHS.length | 0] : ''; }
    el.textContent = s; if (k < 1) el._raf = requestAnimationFrame(step); else el.textContent = text;
  };
  step();
}
// status of one table cell: 0 pending, 1 pass, -1 fail, 2 not applicable
function results(c, t){
  const b = t >= c.bind + .35 ? (c.fate === 'bind' ? -1 : 1) : 0;
  const f = c.fate === 'bind' ? (b ? 2 : 0) : t >= c.funcAt ? (c.fate === 'func' ? -1 : 1) : 0;
  const s = (c.fate === 'bind' || c.fate === 'func') ? ((c.fate === 'bind' ? b : f) ? 2 : 0) : t >= c.selAt ? (c.fate === 'sel' ? -1 : 1) : 0;
  const failed = b === -1 || f === -1 || s === -1, hit = c.fate === 'hit' && t >= c.selAt + .2;
  return {st: [b, f, s], pill: hit ? 'hit' : failed ? 'fail' : ''};
}
let lastPh = null, lastCyc = null;
function updateHUD(t, a){
  const ph = phaseAt(t);
  if (ph !== lastPh){ lastPh = ph; steps.forEach(s => s.classList.toggle('on', s.dataset.k === ph[2])); cap.textContent = ph[3]; }
  const sc = scenAt(t), cur = sc ? currentCand(sc.site, t) : null, sk = sc ? SITE_KEYS[sc.site] + (cur ? cur.v : '') : '';
  if (sk !== lastCyc){
    lastCyc = sk; cycEl.textContent = sc ? SITE_KEYS[sc.site] : '—'; verEl.textContent = cur ? ' v' + cur.v : '';
    if (sc) scenEl.innerHTML = `${sc.surface}<span>→</span><b style="color:${MOD_COL[KIND[sc.site]]}">${MOD_NAME[KIND[sc.site]]}</b>`;
  }
  scenEl.style.opacity = sc ? 1 : 0;
  chips(t, sc, cur);
  cap.style.opacity = prog(t, ph[0], .3) * (1 - prog(t, ph[1] - .25, .25));
  SITE_KEYS.forEach((k, i) => {
    const c = currentCand(i, t), R = rows[i];
    const name = c ? `Site ${k} · ${MOD_NAME[c.kind]}${c.v > 1 ? ' <em>v' + c.v + '</em>' : ''}` : `Site ${k} · <em>awaiting design</em>`;
    const r = c ? results(c, t) : {st: [0, 0, 0], pill: ''};
    const keyS = name + r.st.join() + r.pill;
    if (keyS === R.key) return; R.key = keyS;
    R.name.innerHTML = name;
    R.pill.className = 'pill ' + r.pill; R.pill.textContent = r.pill === 'hit' ? 'HIT' : r.pill === 'fail' ? 'RETRY' : '';
    r.st.forEach((s, j) => R.st[j].className = 'st' + (s === 1 ? ' pass' : s === -1 ? ' fail' : s === 2 ? ' na' : ''));
  });
}
const OK = '<em class="ok">✓</em>', NO = '<em class="no">✕</em>';
function chips(t, sc, c){
  let a = '', b = '';
  if (c && t < c.end + .4){
    if (t >= c.bind + .35) a = c.fate === 'bind' ? NO + 'No binding' : OK + 'Binds';
    if (c.funcAt !== null && t >= c.funcAt) a = c.fate === 'func' ? NO + 'Binds · no conformational change' : OK + 'Binds · ' + sc.effect;
    if (c.selAt !== null && t >= c.selAt) b = c.fate === 'sel' ? NO + 'Binds the off-target' : OK + 'No binding · selective';
  }
  if (chipT._t !== a) chipT.innerHTML = chipT._t = a;
  if (chipO._t !== b) chipO.innerHTML = chipO._t = b;
  knob.style.left = fill.style.width = (LAM_NOW * 100) + '%';
}
const tmp = new V3();
function tag(el, p, alpha, dy = 0){
  tmp.copy(p).project(camera);
  const x = (tmp.x * .5 + .5) * W, y = (-tmp.y * .5 + .5) * H + dy;
  el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`; el.style.opacity = tmp.z < 1 ? alpha : 0;
}

// each scenario turns the target so its site faces the camera (the off-target turns the same way)
const FACE = new V3(.45, .2, 1).normalize();
const SITE_Q = SITE_ATOMS.map(l => new THREE.Quaternion().setFromUnitVectors(centroidA(P0, l).sub(CC).normalize(), FACE));
const qFace = new THREE.Quaternion(), qWob = new THREE.Quaternion(), qIdent = new THREE.Quaternion();
let LAM_NOW = 0;
function facing(t){
  qFace.identity();
  SCEN.forEach((s, i) => { const w = ease(prog(t, s.a - .8, 1.6)); if (w > 0) qFace.slerp(SITE_Q[i], w); });
  return qFace.slerp(qIdent, ease(prog(t, 24.9, 1.2)));
}

// ---------- per-frame scene update ----------
const siteLocT = SITE_KEYS.map(() => new V3()), siteLocO = SITE_KEYS.map(() => new V3()), actLoc = new V3();
function dockOf(group, B, si, outA){
  const c = centroidA(B, SITE_ATOMS[si]), n = c.clone().sub(CC).normalize();
  const p = group.localToWorld(c.clone().addScaledVector(n, outA).multiplyScalar(K));
  const ctr = group.localToWorld(CC.clone().multiplyScalar(K));
  return {p, n: p.clone().sub(ctr).normalize()};
}
const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
function orient(obj, n, spin){ qa.setFromUnitVectors(Z, n); qb.setFromAxisAngle(Z, spin); obj.quaternion.copy(qa).multiply(qb); }
function setRing(m, p, n, scale, alpha, col, spin = 0){
  m.visible = alpha > .004; if (!m.visible) return;
  m.position.copy(p); orient(m, n, spin); m.scale.setScalar(scale); m.material.color.setRGB(col[0]*alpha, col[1]*alpha, col[2]*alpha);
}
function ligPos(c, t, dock){
  const k = ease(prog(t, c.start, FLY));
  const far = dock.p.clone().addScaledVector(dock.n, 7).add(new V3(0, 2.5, 3)), ctrl = dock.p.clone().addScaledVector(dock.n, 2.6).add(new V3(0, 1, 1.5));
  const p = qbez(far, ctrl, dock.p, k);
  if (c.fate === 'bind') p.addScaledVector(dock.n, ease(prog(t, c.bind + .15, .85)) * 1.4);
  if (c.fate === 'hit') p.addScaledVector(dock.n, ease(prog(t, c.leave, .7)) * 2.5);
  p.addScaledVector(dock.n, .03 * Math.sin(t * 2.2 + c.id));
  return {p, k};
}

function update(t){
  const a = ease(prog(t, .2, 2.6)) * (1 - ease(prog(t, 26.6, 1.4)));      // assembly (atoms converge / scatter)
  const fo = 1 - ease(prog(t, 26.2, 1));                                   // outro fade
  const surfT = ease(prog(t, 1.4, 1.4)) * fo, surfO = ease(prog(t, 2.1, 1.2)) * fo;

  LAM_NOW = lamTarget(t);
  conform(BT, t, LAM_NOW); conform(BO, t, .14 + .1 * Math.sin(2*Math.PI*t/(T/4) + 2.5));
  const q = facing(t);
  tgt.quaternion.copy(q).multiply(qWob.setFromAxisAngle(Y, .14 * Math.sin(2*Math.PI*t/T*2)));
  off.quaternion.copy(q).multiply(qWob.setFromAxisAngle(Y, .2 * Math.sin(2*Math.PI*t/T + 2)));
  scene.updateMatrixWorld();

  // site / functional-site / off-target states
  const siteCol = [], offCol = [], siteGlow = [];
  let act = 0, actRed = 0;
  for (let i = 0; i < 3; i++){
    const c = currentCand(i, t);
    let g = .35 * prog(t, 1.4, 1.4), red = 0, ored = 0, opass = 0;
    if (c){
      g = Math.max(g, .55 + .25 * Math.sin(t * 6) * (t < c.start + FLY ? 1 : 0));
      if (c.fate === 'hit' && t >= c.selAt) g = .85 + .15 * Math.sin(t * 3);
      if (c.fate === 'bind') red = prog(t, c.bind + .2, .3) * (1 - prog(t, c.end, .4));
      if (c.fate === 'func') red = prog(t, c.funcAt, .3) * (1 - prog(t, c.end, .4));
    }
    for (const k of CANDS) if (k.site === i){
      if (k.selAt !== null && k.fate === 'sel') ored = Math.max(ored, prog(t, k.selAt, .25) * (1 - prog(t, k.end, .4)));
      else if (k.selAt !== null && t >= k.selAt) opass = Math.max(opass, 1 - prog(t, k.selAt, 1));
      if ((k.fate === 'hit' || k.fate === 'sel') && t >= k.funcAt) act = Math.max(act, (.75 + .25 * Math.sin(t * 4) + (1 - prog(t, k.funcAt, .8))) * (1 - prog(t, k.leave, .6)));
      if (k.fate === 'func' && t >= k.funcAt) actRed = Math.max(actRed, 1 - prog(t, k.funcAt, .9));
    }
    g *= fo * a; red *= fo; ored *= fo;
    siteGlow.push({g, red, ored, opass});
    siteCol.push(red > .01 ? [LC.red, red] : [LC.site, Math.min(1, g * 1.1)]);
    offCol.push(ored > .01 ? [LC.red, ored] : [LC.pass, opass * .6]);
  }
  act = Math.min(act, 1.6) * fo;
  if (surfT > .005){ updateSurface(mcT, BT, DOMC.t, siteCol, actRed > .02 ? [LC.red, actRed * .8] : [LC.teal, Math.min(act, 1) * .85]); }
  if (surfO > .005){ updateSurface(mcO, BO, DOMC.o, offCol, [LC.teal, 0]); }
  mcT.visible = surfT > .005; mcO.visible = surfO > .005; matT.opacity = surfT; matO.opacity = surfO * .4;

  // atom glow layers (also the assembly animation)
  for (const [L, B, isT] of [[atomsT, BT, true], [atomsO, BO, false]]){
    L.n = 0; const twinkle = .03 + .5 * Math.sin(Math.PI * a);
    for (let i = 0; i < N; i++){
      const j = i*3, dx = B[j] - CC.x, dy = B[j+1] - CC.y, dz = B[j+2] - CC.z, dl = Math.hypot(dx, dy, dz) || 1, push = RAD[i] * 1.15 / dl;
      const x = B[j] + dx*push, y = B[j+1] + dy*push, z = B[j+2] + dz*push;
      const px = (SCAT[j] + (x - SCAT[j]) * a) * K, py = (SCAT[j+1] + (y - SCAT[j+1]) * a) * K, pz = (SCAT[j+2] + (z - SCAT[j+2]) * a) * K;
      let col = C.ice, al = twinkle * (.5 + .5 * Math.sin(t * 3 + phase[i] * 3)), sz = .05;
      const si = siteOf[i];
      if (si >= 0){ const s = siteGlow[si];
        if (isT){ if (s.red > .02){ col = C.red; al = Math.max(al, s.red * .55); sz = .14; } else if (s.g > .02){ col = C.site; al = Math.max(al, s.g * .4); sz = .13; } }
        else if (s.ored > .02){ col = C.red; al = Math.max(al, s.ored * .55); sz = .14; } else if (s.opass > .02){ col = C.pass; al = Math.max(al, s.opass * .5); sz = .13; } }
      if (isT && isAct[i]){ if (actRed > .02){ col = C.red; al = Math.max(al, actRed * .6); sz = .15; } else if (act > .02){ col = C.teal; al = Math.max(al, act * .45); sz = .15; } }
      L.push(px, py, pz, col, al * (isT ? 1 : .35), sz);
    }
    L.flush();
  }

  // ligands, ghosts, rings, particles
  fx.n = 0;
  const actW = tgt.localToWorld(centroidA(BT, ACT).clone().addScaledVector(centroidA(BT, ACT).clone().sub(CC).normalize(), 3).multiplyScalar(K));
  let warmI = 0;
  for (const c of CANDS){
    const dock = dockOf(tgt, BT, c.site, OUT[c.kind]), od = dockOf(off, BO, c.site, OUT[c.kind] * .8);
    const live = t >= c.start && t < c.end + .7;
    let alpha = 0, lp = null;
    if (live){
      lp = ligPos(c, t, dock);
      alpha = prog(t, c.start, .35) * (1 - prog(t, c.end, c.fate === 'hit' ? .6 : .25)) * fo;
      c.obj.position.copy(lp.p); orient(c.obj, dock.n, (1 - lp.k) * 6 + .15 * Math.sin(t * 1.3 + c.site));
      if (lp.k > .9) warmI += alpha;
    }
    c.obj.visible = alpha > .004; c.mats.forEach(m => m.opacity = alpha);
    c.alpha = alpha; c.dock = dock;

    // binding pulse at the target site
    const sb = prog(t, c.bind, .8);
    setRing(c.rings[0], dock.p, dock.n, .5 + 1.3 * ease(sb), sb > 0 && sb < 1 ? (1 - sb) * fo : 0, c.fate === 'bind' ? C.red : C.pass);
    // selectivity test: a ghost copy is offered to the off-target
    let ga = 0;
    if (c.ghost !== undefined && t >= c.ghost){
      const g = ease(prog(t, c.ghost, GD)), mid = dock.p.clone().add(od.p).multiplyScalar(.5).add(new V3(0, 1.8, 1));
      const gp = qbez(dock.p, mid, od.p, g);
      ga = .75 * prog(t, c.ghost, .2) * fo;
      if (c.fate === 'sel') ga *= 1 - prog(t, c.end, .25);
      else { const b = prog(t, c.selAt, .7); gp.addScaledVector(od.n, ease(b) * 1.8); ga *= 1 - b; }
      c.ghostObj.position.copy(gp); orient(c.ghostObj, od.n, t * 1.5);
      for (let k = 0; k < 10 && g < 1; k++){ const u = Math.max(0, g - k * .025); fx.push(...qbez(dock.p, mid, od.p, u).toArray(), C.pass, ga * (1 - k / 10) * .6, .09); }
      const ss = prog(t, c.selAt, .8);
      setRing(c.rings[1], od.p, od.n, .4 + 1.1 * ease(ss), ss > 0 && ss < 1 ? (1 - ss) * fo : 0, c.fate === 'sel' ? C.red : C.pass);
    } else c.rings[1].visible = false;
    c.ghostObj.visible = ga > .004; c.gmat.opacity = ga;
    // locked hit ring
    const hr = c.fate === 'hit' ? prog(t, c.selAt + .1, .5) * fo * (1 - .45 * prog(t, c.leave, .6)) : 0;
    setRing(c.rings[2], dock.p, dock.n, .62 + .04 * Math.sin(t * 3), hr * .9, C.gold, t * .8);

    // function test: a signal travels from the bound site to the functional site

      const s = prog(t, c.wave, .8), ctrl = dock.p.clone().add(actW).multiplyScalar(.5).addScaledVector(dock.n, 1.2);
      for (let k = 0; k < 16; k++){
        const u = s * 1.3 - k * .03; if (u <= 0 || u >= 1) continue;
        let al = (1 - k / 16) * (1 - prog(t, c.wave + .9, .4)) * fo;
        if (c.fate === 'func') al *= 1 - prog(u, .4, .15);
        fx.push(...qbez(dock.p, ctrl, actW, u).toArray(), c.fate === 'func' && u > .3 ? C.red : C.teal, al, .12);
      }
    }
    // dissolve failed candidates into particles
    if (c.fate !== 'hit' && t >= c.end && t < c.end + 1.7){
      const s = t - c.end, r = rng(100 + c.id), o = ligPos(c, c.end - .001, dock).p, base = hdr(MOD_COL[c.kind], 2.4);
      const origins = c.fate === 'sel' ? [o, od.p] : [o];
      for (const org of origins) for (let k = 0; k < 110; k++){
        const u = r()*2 - 1, th = r()*6.283, q = Math.sqrt(1 - u*u), sp = .4 + r()*1.5, d = sp * s * (1 - s / 3.4);
        const al = Math.pow(1 - s / 1.7, 1.6) * fo, col = r() < .5 ? base : C.red;
        fx.push(org.x + Math.cos(th)*q*d, org.y + u*d - .12*s*s, org.z + Math.sin(th)*q*d, col, al, .04 + r()*.07);
      }
    }
    // hit burst
    if (c.fate === 'hit' && t >= c.selAt + .1 && t < c.selAt + 1.5){
      const s = t - c.selAt - .1, t1 = new V3().crossVectors(dock.n, Y).normalize(), t2 = new V3().crossVectors(dock.n, t1), r = rng(200 + c.id);
      for (let k = 0; k < 70; k++){
        const th = k / 70 * 6.283 + r() * .1, d = .3 + s * (.8 + r() * .9);
        const p = dock.p.clone().addScaledVector(t1, Math.cos(th) * d).addScaledVector(t2, Math.sin(th) * d).addScaledVector(dock.n, r() * .2);
        fx.push(p.x, p.y, p.z, C.gold, Math.pow(1 - s / 1.4, 2) * fo, .05 + r() * .05);
      }
    }
  }
  warm.position.copy(TP).add(new V3(0, 0, 2.5)); warm.intensity = Math.min(warmI, 2) * 2.5;

  // learn: a scan ring sweeps through the target
  const lw = LEARN.find(([x, y]) => t >= x && t < y);
  if (lw){ const s = prog(t, lw[0], lw[1] - lw[0]); scanRing.visible = true; scanRing.position.set(TP.x, TP.y + 2.2 - 4.4 * ease(s), TP.z);
    const al = Math.sin(Math.PI * s); scanRing.material.color.setRGB(C.pass[0] * al, C.pass[1] * al, C.pass[2] * al); scanRing.rotation.z = t; } else scanRing.visible = false;

  // floating dust (periodic, so the loop is seamless)
  dust.n = 0;
  for (const d of DUST){ const w = 2*Math.PI*t/T; dust.push(d[0] + Math.sin(w + d[3]) * d[4], d[1] + Math.cos(w * 2 + d[3]) * d[4] * .5, d[2], C.dust, d[6] * (.6 + .4 * Math.sin(w * 3 + d[3] * 5)), d[5]); }
  dust.flush(); fx.flush();

  placeCamera(t);
  finish.uniforms.uTime.value = t;

  // HUD
  updateHUD(t, a);
  tag($('tagT'), TP.clone().add(new V3(0, -2.3, 0)), surfT);
  tag($('tagO'), OP.clone().add(new V3(0, -1.9, 0)), surfO);
  SITE_KEYS.forEach((k, i) => {
    const c = currentCand(i, t), el = siteTags[i];
    if (!c || !c.dock || c.alpha < .01){ el.style.opacity = 0; return; }
    const txt = `<b>${k}</b>${MOD_NAME[c.kind]}${c.v > 1 ? ' v' + c.v : ''}`;
    if (el._t !== txt){ el._t = txt; el.innerHTML = txt; }
    tag(el, c.dock.p.clone().addScaledVector(c.dock.n, 1.05), c.alpha * (1 - prog(t, 24.9, .5)));
  });
}

// ---------- time: autoplay + scroll / drag scrubbing ----------
let clock = FIXED !== null ? FIXED : 0, scrubVel = 0, paused = false, touchY = null, last = performance.now();
document.documentElement.classList.toggle('capture', CAPTURE);

let onScreen = true;
new IntersectionObserver(e => { onScreen = e[0].isIntersecting; }).observe(card);
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (FIXED === null){
    if (onScreen) clock += dt * ((paused ? 0 : SPEED) + scrubVel);
    clock = ((clock % T) + T) % T;
    scrubVel *= Math.exp(-dt * 3);
  }
  parallax.x += (parallax.tx - parallax.x) * Math.min(1, dt * 2.5); parallax.y += (parallax.ty - parallax.y) * Math.min(1, dt * 2.5);
  if (onScreen || FIXED !== null){ update(clock); composer.render(dt); }
  requestAnimationFrame(loop);
}
// frame-exact hook for offline video capture
window.renderAt = s => { clock = s; parallax.x = parallax.y = 0; update(s); composer.render(0); };
requestAnimationFrame(loop);
</script>
